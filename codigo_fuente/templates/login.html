<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar | Microrred Solar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body class="ingreso">
    <form class="caja-ingreso" method="post" action="{{ url_for('login') }}">
        <h1>Microrred Solar</h1>
        <p class="descripcion">Plataforma transaccional de energía solar compartida entre los hogares del barrio.</p>
        {% for categoria, texto in get_flashed_messages(with_categories=true) %}
        <div class="mensaje {{ categoria }}" role="alert">{{ texto }}</div>
        {% endfor %}
        <label for="correo">Correo</label>
        <input id="correo" name="correo" type="email" maxlength="120" required autofocus autocomplete="username">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" maxlength="72" required autocomplete="current-password">
        <button class="boton" type="submit">Ingresar</button>
    </form>
</body>
</html>
